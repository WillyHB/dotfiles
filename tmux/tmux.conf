unbind C-b
set-option -g prefix M-e
bind-key M-e send-prefix

set -g mode-keys vi

bind q killp
bind Q killw
unbind &

bind o split-window -v
bind p split-window -h

unbind '"'
unbind %
bind r source-file "~/.config/tmux/tmux.conf"; display-message "~/.tmux.conf reloaded."

unbind l

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

unbind n
unbind m

bind -n M-[ previous-window
bind -n M-] next-window
bind u select-pane -m

set -g base-index 1
set-window-option -g pane-base-index 1

unbind '{'
unbind '}'

bind -n M-H swap-pane -U
bind -n M-L swap-pane -D

unbind (
unbind )
bind -n M-n switch-client -p
bind -n M-m switch-client -n

# bind C-l resize-pane -L 5 
# bind C-h resize-pane -R 5
# bind C-j resize-pane -D 5
# bind C-k resize-pane -U 5

set -sg escape-time 10
set-option -g set-clipboard on

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

set -g mouse on

set -g update-environment "WAYLAND_DISPLAY DISPLAY"

bind -n M-r command-prompt "rename-window '%%'"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
